name: cbwatch

services:
  scraper:
    build: .
    command: ["python", "-m", "cbwatch.demo"]
    env_file: .env
    environment:
      METRICS_PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  reconciler:
    build: .
    command: ["python", "-m", "cbwatch.reconciler"]
    env_file: .env
    environment:
      METRICS_PORT: "8001"
      ACCOUNT_STATE_FILE: /app/state/account_state.json
    volumes:
      # Keeps the last Account API call time across restarts (5 minute guard).
      - reconciler-state:/app/state
    ports:
      - "8001:8001"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on: [scraper, reconciler]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/crawlbase.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  reconciler-state:
    # Fixed name: the step stacks in code/steps share it, so the 5 minute
    # Account API guard holds across every stack that uses the same token.
    name: cbwatch-account-state
  prometheus-data:
  grafana-data:
